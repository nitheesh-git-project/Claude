# Supabase CLI configuration for the LOCAL, DISPOSABLE stack only.
#
# This file exists so the pre-merge quality gate (.github/workflows/
# quality-gate.yml) can run `supabase start` on a CI runner and get a
# Postgres + Auth + REST + Realtime + Storage stack on loopback. It is not a
# deployment config: nothing here is applied to the hosted staging or
# production projects, `scripts/run-schema.mjs` and
# `.github/workflows/schema-apply.yml` do not read it, and `supabase db push`
# must never be run from this directory.
#
# supabase/schema.sql stays the single source of truth. There is deliberately
# no `migrations/` directory: scripts/ci/provision-local-stack.sh applies the
# file with psql, twice, because re-runnability is the deployment story.
#
# Services that nothing in the gate uses are off, to keep a runner's start
# time and memory down: Studio, Edge Runtime, Analytics/Logflare, Vector,
# the pooler and image transformation. Mailpit stays on here for anyone
# running the stack by hand, so GoTrue mail has somewhere local to go -- no
# real mail provider is ever configured -- but the gate starts the stack
# without it (`supabase start -x ...` in scripts/ci/provision-local-stack.sh,
# which says why each excluded service is unused).
project_id = "moverestore-ci"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"




[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

# The suite mints a session per spec from one address, so GoTrue's per-IP
# defaults (30 sign-ins per five minutes) would throttle a healthy run and
# read as a broken fixture. These are limits on a disposable loopback stack.
[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
anonymous_users = 1000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

# Phone sign-in (src/lib/phoneLogin.ts) on the LOCAL, disposable stack only.
# Sign-ups by phone stay off (phone sign-in never creates an account). The
# numbers under test_otp never reach a provider: GoTrue answers them with the
# fixed code, which is what e2e/phone-login.spec.ts types. Twilio is "enabled"
# with placeholder values only because GoTrue needs some provider switched on
# to accept phone codes at all; nothing is ever sent (the test numbers skip it,
# and the gate's egress guard blocks the internet anyway). The deployed
# projects take their provider from the Supabase dashboard, not from here:
# docs/auth/PHONE-SIGN-IN.md.
[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "1s"

[auth.sms.test_otp]
919990000101 = "246810"
919990000102 = "246810"
919990000103 = "246810"

[auth.sms.twilio]
enabled = true
account_sid = "AC-local-placeholder-not-a-credential"
message_service_sid = "MG-local-placeholder-not-a-credential"
auth_token = "local-placeholder-not-a-credential"

[edge_runtime]
enabled = false

[analytics]
enabled = false
