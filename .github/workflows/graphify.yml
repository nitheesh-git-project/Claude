name: Refresh graphify graph

# Rebuilds the knowledge graph whenever code lands on main and commits the
# result back, so a fresh clone always has a current graph without anyone
# remembering to run /graphify.
on:
  push:
    branches: [main]
    # Without this, the commit made at the end of this workflow would push to
    # main and trigger the workflow again, forever. The "[skip ci]" in that
    # commit message is the second guard.
    paths-ignore:
      - "graphify-out/**"

# A burst of merges shouldn't run overlapping rebuilds that race each other
# to commit. Newer run wins; the in-flight one is cancelled.
concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the refresh branch.
      contents: write
      # Needed to open the pull request that carries it onto main.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        run: pip install "graphifyy[gemini]"

      - name: Rebuild the graph
        env:
          # Optional: enables semantic extraction. Without it graphify still
          # builds a graph, just a structural one -- so a repo with no secret
          # configured gets a working (if shallower) graph rather than a
          # failing workflow.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # --no-viz: the interactive HTML is large and regenerable locally,
          # and is gitignored anyway. CI produces the committed text outputs
          # (graph.json, GRAPH_REPORT.md, manifest.json) only.
          build() {
            if [ -f graphify-out/graph.json ]; then
              graphify . --update --no-viz
            else
              graphify . --no-viz
            fi
            # `extract`/`update` intentionally stop at graph.json --
            # GRAPH_REPORT.md and named communities are a separate step
            # (graphify's own "next: run graphify cluster-only" hint), so
            # without this the report never gets produced even though the run
            # succeeds.
            graphify cluster-only . --no-viz
          }

          # Semantic extraction runs against Gemini's free tier, which allows
          # 20 requests per day per model. A day with a few merges exhausts it,
          # every chunk then comes back 429 ("RESOURCE_EXHAUSTED"), and graphify
          # exits 1 -- so the committed graph goes stale on exactly the days the
          # repo changed most. A structural graph is already the documented
          # answer to "no key configured", so give "key out of quota" the same
          # answer rather than failing the run: unset the key and rebuild
          # structurally, which needs no API at all.
          if ! build; then
            echo "Semantic extraction failed (quota or API error). Rebuilding structurally."
            unset GEMINI_API_KEY GOOGLE_API_KEY
            build
          fi

      # main is protected by a ruleset requiring every change to go through a
      # pull request, so the direct push this step used to do was rejected
      # with "GH013: Repository rule violations found" and failed the job on
      # every single merge -- while the graph it had just spent two minutes
      # building was thrown away. The graph is committed on purpose (see
      # AGENTS.md: manifest.json is the per-file hash record `--update` diffs
      # against, and without it every run re-extracts the whole corpus and
      # burns the Gemini free tier), so dropping the commit is not an option.
      #
      # So it opens a pull request instead, onto one long-lived branch that is
      # force-updated each time. One PR exists at a time and it always carries
      # the current graph; merging it is a click. Deliberately NOT a push to
      # the branch of whoever merged: sessions in this repo push to their own
      # claude/* branches constantly, and a CI commit landing underneath one
      # turns their next push into a rejected non-fast-forward.
      - name: Open a pull request with the refreshed graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          # Nothing to do when the merge didn't change anything the graph
          # cares about -- `git commit` would fail the job on an empty commit.
          if git diff --cached --quiet; then
            echo "Graph unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh graphify knowledge graph [skip ci]"

          BRANCH=chore/graphify-refresh
          # Force, because this branch is a snapshot of the latest graph
          # rather than a history worth keeping -- and because it is rebuilt
          # from main each run, so it never carries anything else.
          git push --force origin "HEAD:$BRANCH"

          # `gh pr create` fails if one is already open for this branch, and
          # that is the ordinary case: the branch was just updated in place,
          # so the existing PR now points at the new commit and there is
          # nothing more to do.
          open_count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "Refresh PR already open for $BRANCH; it now carries the latest graph."
            exit 0
          fi

          # Heredoc rather than an inline --body. A multi-line string passed
          # straight to --body has to carry this block scalar's indentation on
          # every continuation line, and a line that loses it stops the whole
          # workflow file being valid YAML -- which is how the first attempt at
          # this step broke.
          cat > /tmp/graphify-pr-body.md <<'BODY'
          Automated rebuild of `graphify-out/` after the latest merge.

          Merge this to keep `manifest.json` current -- it is the per-file hash
          record that `graphify --update` diffs against, and while it is stale
          every run re-extracts the whole corpus and exhausts the Gemini free
          tier's daily quota.

          Opened by `.github/workflows/graphify.yml`.
          BODY

          # Opening the PR can be refused by a repository setting --
          # "Allow GitHub Actions to create and approve pull requests", off by
          # default, answering
          # "GitHub Actions is not permitted to create or approve pull
          # requests". That refusal must not fail the job: the branch above
          # already carries the refreshed graph, so the work is saved either
          # way and all that is missing is one click. Failing here would put
          # this workflow back exactly where it was -- red on every merge, for
          # a reason no one reading the red X could act on.
          if gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH" \
            --title "chore: refresh graphify knowledge graph" \
            --body-file /tmp/graphify-pr-body.md
          then
            exit 0
          fi

          {
            echo "### Graph refreshed, pull request not opened"
            echo
            echo "The rebuilt graph is pushed to \`$BRANCH\` and nothing is lost,"
            echo "but this job could not open the pull request for it."
            echo
            echo "Open it here:"
            echo "https://github.com/${{ github.repository }}/pull/new/$BRANCH"
            echo
            echo "To let the workflow do this itself, tick **Settings ->"
            echo "Actions -> General -> Allow GitHub Actions to create and"
            echo "approve pull requests**."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Graph pushed to $BRANCH but the pull request could not be opened -- see the job summary."
