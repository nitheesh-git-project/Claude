# Non-destructive smoke check of the deployed staging site: a handful of
# anonymous GET requests (scripts/ci/staging-smoke.mjs). It signs in as
# nobody and writes nothing, so it is safe against any deployment.
#
# Runs on a deployment-status event from the hosting integration, and by
# hand. It needs the repository *variable* STAGING_URL (not a secret -- it
# is a public origin); PRODUCTION_URL, if set, is refused as a target. It is
# not part of the pre-merge gate and not a required check: no deployment is
# triggered from this repository. docs/ci/STAGING-SMOKE.md has the detail.
name: Staging smoke

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    # Only the cheap, always-true-or-false facts are filtered here. Which
    # branch a deployment is of is NOT: Vercel creates every non-production
    # deployment -- staging's included -- with `ref` set to the commit SHA
    # and environment "Preview", so the old `deployment.ref == 'staging'`
    # was never true and every staging deployment skipped this job without
    # a word (QA F-08, run 38498440871). The gate step below asks GitHub
    # whether the deployed SHA is on staging and writes its answer to the
    # job summary, so a run that checks nothing says why.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production' &&
       github.event.deployment.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decide whether this deployment is staging's
        id: gate
        run: node scripts/ci/staging-smoke-gate.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_ENVIRONMENT: ${{ github.event.deployment.environment }}
          STAGING_URL: ${{ vars.STAGING_URL }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke-check staging
        if: steps.gate.outputs.run == 'true'
        run: node scripts/ci/staging-smoke.mjs
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
