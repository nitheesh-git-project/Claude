# Non-destructive smoke check of the deployed staging site: a handful of
# anonymous GET requests (scripts/ci/staging-smoke.mjs). It signs in as
# nobody and writes nothing, so it is safe against any deployment.
#
# Runs on a deployment-status event from a hosting integration that reports
# one, and by hand. It needs the repository *variable* STAGING_URL (not a
# secret -- it is a public origin); PRODUCTION_URL, if set, is refused as a
# target. With STAGING_URL unset it says so and fails, because "nothing was
# checked" is not a pass. It is not part of the pre-merge gate and not a
# required check: no deployment is triggered from this repository.
name: Staging smoke

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    # Only a successful deployment of the staging environment, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production' &&
       github.event.deployment.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke-check staging
        run: node scripts/ci/staging-smoke.mjs
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
