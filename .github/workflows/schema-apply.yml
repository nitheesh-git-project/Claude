name: Apply schema to Supabase

# supabase/schema.sql is the single source of truth for the live database
# (see AGENTS.md), and is only ever wired to the real Supabase project by
# running scripts/run-schema.mjs by hand. That manual step is easy to skip,
# and a merged schema.sql change that never gets applied silently leaves the
# app's RLS policies (and everything else in the file) out of sync with the
# code that assumes them -- the app can look fixed in review and still fail
# in production. This applies the file automatically on every push to main
# that touches it, so the schema in the repo and the schema in Supabase can
# never drift apart for more than one merge.

on:
  push:
    branches: [main]
    paths:
      - "supabase/schema.sql"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Checked here rather than left to the script, because the script's own
      # error names .env.local -- correct on a laptop, meaningless on a
      # runner, and this job failed five merges in a row with that message
      # while nobody could tell from it what to actually do. It still fails
      # (a merged schema change that never reached the database is exactly
      # what this workflow exists to catch), but it fails saying where the
      # missing values go.
      - name: Check the Supabase secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          if [ -n "$missing" ]; then
            {
              echo "### Schema not applied"
              echo
              echo "Missing repository secret(s):$missing"
              echo
              echo "Add them under **Settings -> Secrets and variables -> Actions**:"
              echo "- \`SUPABASE_ACCESS_TOKEN\` — a personal access token from"
              echo "  https://supabase.com/dashboard/account/tokens (not the service role key)"
              echo "- \`NEXT_PUBLIC_SUPABASE_URL\` — the project URL"
              echo
              echo "Until then every schema change must be applied by hand with"
              echo "\`node scripts/run-schema.mjs\`, and the database will drift from the repo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing repository secret(s):$missing -- see the job summary. schema.sql was NOT applied."
            exit 1
          fi

      - name: Run schema.sql against Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/run-schema.mjs
