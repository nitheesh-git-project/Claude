# Runs the app's housekeeping on a schedule: Calendar/Meet retries, Meet
# waiting rooms, the risk scan and the credential purge. Without it these
# ran only when an admin opened the dashboard.
#
# Needs two repository secrets, set by a person (they are credentials):
#   MAINTENANCE_URL  the deployed app's origin, e.g. https://example.com
#   CRON_SECRET      the same value as the app's CRON_SECRET env var
# With either missing the job says so and exits cleanly.
name: Maintenance

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the maintenance sweep
        env:
          MAINTENANCE_URL: ${{ secrets.MAINTENANCE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MAINTENANCE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "MAINTENANCE_URL or CRON_SECRET is not set; nothing to run."
            exit 0
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$MAINTENANCE_URL/api/cron/maintenance"
